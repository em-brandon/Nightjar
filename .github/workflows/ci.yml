# Checks for Nightjar itself, on GitHub. Client apps get their own pipeline on Gitea (docs/PIPELINE.md, planned).
#
# Every step is a command that also runs on a laptop, so a failure here is reproduced with the same line locally.
# See docs/CI.md.

name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

# A newer push to the same branch makes an older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: nothing here needs to write to the repository.
permissions:
  contents: read

jobs:
  console:
    name: Console (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4
      # Node 24 matches development. The .mjs tests import .ts files directly, which needs a Node that strips types.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            console/package-lock.json
            tools/typegen/package-lock.json
      - run: npm ci
      # tsc under strict, then the console's rules and the CSS collision guard
      - run: npm test
      - run: npm run build
      # The generated API types must match the committed OpenAPI schema. (tests/test_openapi_snapshot.py already
      # checks the schema against the hub itself, so together a hub change that was not regenerated fails somewhere.)
      - name: Generated API types are up to date
        run: |
          npm run types
          git diff --exit-code -- src/api || { echo "console/src/api is stale: run 'npm run types' in console/ and commit it"; exit 1; }

  hub:
    name: Hub (Python, Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      # The tests make a throwaway database each (tests/test_*.py), so this user must be able to create databases:
      # the image's POSTGRES_USER is a superuser.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hub
          POSTGRES_PASSWORD: hub
          POSTGRES_DB: nightjar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hub -d nightjar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://hub:hub@localhost:5432/nightjar
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # The server reporters are tested against the real hub in Node, PHP and Java (tests/test_server_reporters.py).
      # A runtime that is missing is skipped by name, so they are installed and their versions printed here to make
      # a silent skip visible in the log.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -r requirements.txt
      - name: Runtimes the reporter tests use
        run: |
          node --version
          php --version | head -1 || echo "php: not installed, its reporter tests will be skipped"
          javac -version || echo "java: not installed, its reporter tests will be skipped"
      # Migrations, auth, fingerprinting, the alert outbox and policy, uptime, receipts, and the reporter contract
      - name: Hub tests
        run: python -m unittest discover -s tests
      # The client-side reporters and the staging stack reporter, which run on other machines and need no database
      - name: Client reporter tests
        run: python -m unittest discover -s client

  # The reporters' own tests: what they send, that they never break the app, the scrubbing, the https-only rule and the
  # hub-reply warning. They need no database. (tests/test_server_reporters.py in the hub job is the other half: the same
  # reporters talking to the real hub.) A missing runtime fails here instead of skipping, because a safeguard that
  # silently does not run is worse than none.
  reporters:
    name: Reporters (Node, browser, PHP, Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # Node 24 strips types, which the .mjs tests rely on to import the .ts reporters directly.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Runtimes
        run: |
          node --version
          java -version
          command -v php >/dev/null || { echo "php is not installed on this runner"; exit 1; }
          php --version | head -1
      - name: Node reporter
        run: node client/node/nightjar.test.mjs
      - name: Browser reporter
        run: node client/browser/nightjar.test.mjs
      - name: PHP reporter
        run: php client/php/test.php
      # Compiled for Java 11, the oldest the reporter promises to support, then run on 17.
      - name: Java reporter
        run: |
          javac --release 11 -d "$RUNNER_TEMP/nj-java" client/java/Nightjar.java client/java/NightjarTest.java
          java -cp "$RUNNER_TEMP/nj-java" nightjar.NightjarTest

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      # The whole history, so a secret committed and then deleted is still found.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The same image and config as the pre-commit hook, so a failure reproduces locally (docs/DATA-PROTECTION.md).
      - run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner
