<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="920" height="560" role="img" aria-label="Isometric cutaway of the Nightjar cabinet with top and front panel removed">
<title>Nightjar cabinet - isometric cutaway</title>
<desc>Isometric view with the lid and front panel removed. Two ThinkCentre M720q units lie flat side by side with their front grilles facing the cabinet front and a 40 mm rear plenum behind them. Two filtered 80 mm intake fans sit in the floor, two 80 mm exhaust fans in the lid above the rear plenum, and a panel mount HDMI coupler exits the lid.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 2 L9 5 L2 8" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round"/>
</marker>
<marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M3 2 L7 5 L3 8" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round"/>
</marker>
<pattern id="filt" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#B4741F" stroke-width="1" opacity="0.5"/>
</pattern>
</defs>
<style>
.t { font: 600 14px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; letter-spacing:1.2px; }
.st { font: 400 11px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; opacity:.65; }
.n { font: 400 11.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; }
.nh { font: 600 11.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; }
.dim { font: 500 11px ui-monospace,"SF Mono",Menlo,monospace; fill:#B4741F; }
.lb { font: 500 10.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; }
</style>
<rect width="920" height="560" fill="#F7F5EF"/>

<text class="t" x="40" y="34" text-anchor="start">CABINET — ISOMETRIC CUTAWAY</text>
<text class="st" x="40" y="52" text-anchor="start">lid and front panel removed · internal 400 × 250 × 120 · all dims mm</text>
<polygon points="285.0,140.0 562.1,300.0 562.1,204.0 285.0,44.0" fill="#EAE6DA" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="285.0,140.0 111.8,240.0 111.8,144.0 285.0,44.0" fill="#E2DED1" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="285.0,140.0 562.1,300.0 388.9,400.0 111.8,240.0" fill="#F2EFE6" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="562.1,300.0 388.9,400.0 388.9,304.0 562.1,204.0" fill="#D8D3C4" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<ellipse cx="215.7" cy="260.0" rx="39.2" ry="22.6" fill="url(#filt)" stroke="#B4741F" stroke-width="1.3" transform="rotate(-30 215.7 260.0)"/>
<ellipse cx="215.7" cy="260.0" rx="11.8" ry="6.8" fill="none" stroke="#B4741F" stroke-width="1.3" transform="rotate(-30 215.7 260.0)" stroke-dasharray="3 3"/>
<ellipse cx="354.3" cy="340.0" rx="39.2" ry="22.6" fill="url(#filt)" stroke="#B4741F" stroke-width="1.3" transform="rotate(-30 354.3 340.0)"/>
<ellipse cx="354.3" cy="340.0" rx="11.8" ry="6.8" fill="none" stroke="#B4741F" stroke-width="1.3" transform="rotate(-30 354.3 340.0)" stroke-dasharray="3 3"/>
<polygon points="274.6,121.6 398.6,193.2 271.8,266.4 147.8,194.8" fill="#FFFFFF" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="398.6,220.8 271.8,294.0 271.8,266.4 398.6,193.2" fill="#E9E5D9" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="147.8,222.4 271.8,294.0 271.8,266.4 147.8,194.8" fill="#DDD8C9" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="411.1,200.4 535.1,272.0 408.3,345.2 284.3,273.6" fill="#FFFFFF" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="535.1,299.6 408.3,372.8 408.3,345.2 535.1,272.0" fill="#E9E5D9" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<polygon points="284.3,301.2 408.3,372.8 408.3,345.2 284.3,273.6" fill="#DDD8C9" stroke="#0F1420" stroke-width="1.2" opacity="1.0"/>
<text class="lb" x="272.87564434701784" y="193.8" text-anchor="middle">M720q</text>
<text class="lb" x="409.3612479834454" y="272.6" text-anchor="middle">bay 2</text>
<path d="M278.1 304.0 L250.4 320.0" fill="none" stroke="#B4741F" stroke-width="1.3" marker-start="url(#dm)" marker-end="url(#dm)"/>
<ellipse cx="340.4" cy="92.0" rx="39.2" ry="22.6" fill="none" stroke="#B4741F" stroke-width="1.3" stroke-dasharray="5 4" transform="rotate(-30 340.4 92.0)"/>
<path d="M340.4 86.0 L340.4 40.0" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<ellipse cx="479.0" cy="172.0" rx="39.2" ry="22.6" fill="none" stroke="#B4741F" stroke-width="1.3" stroke-dasharray="5 4" transform="rotate(-30 479.0 172.0)"/>
<path d="M479.0 166.0 L479.0 120.0" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<polygon points="285.0,44.0 562.1,204.0 388.9,304.0 111.8,144.0" fill="none" stroke="#0F1420" stroke-width="1.5" opacity="1.0"/>
<polygon points="111.8,240.0 388.9,400.0 388.9,304.0 111.8,144.0" fill="none" stroke="#0F1420" stroke-width="1.1" opacity="0.5" stroke-dasharray="6 5"/>
<rect x="282.4" y="55.0" width="26" height="14" rx="2" fill="#FFFFFF" stroke="#0F1420" stroke-width="1.3"/>
<path d="M295.4 52.0 L295.4 16.0" fill="none" stroke="#0F1420" stroke-width="1.4" marker-end="url(#ar)"/>
<text class="lb" x="301.39230484541326" y="10.0" text-anchor="start">HDMI up to screen</text>
<path d="M215.7 306.0 L215.7 266.0" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M354.3 386.0 L354.3 346.0" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="nh" x="640" y="100" text-anchor="start">LAYOUT</text>
<text class="n" x="640" y="117" text-anchor="start">Devices flat, side by side, front</text>
<text class="n" x="640" y="134" text-anchor="start">grilles toward the front panel.</text>
<text class="n" x="640" y="151" text-anchor="start">40 mm rear plenum — their own</text>
<text class="n" x="640" y="168" text-anchor="start">exhaust vents into it.</text>
<text class="nh" x="640" y="202" text-anchor="start">AIRFLOW</text>
<text class="n" x="640" y="219" text-anchor="start">2 × 80 mm filtered intake in the</text>
<text class="n" x="640" y="236" text-anchor="start">floor, one under each bay.</text>
<text class="n" x="640" y="253" text-anchor="start">2 × 80 mm exhaust in the lid,</text>
<text class="n" x="640" y="270" text-anchor="start">directly over the rear plenum.</text>
<text class="n" x="640" y="287" text-anchor="start">Bottom-to-top: convection helps</text>
<text class="n" x="640" y="304" text-anchor="start">rather than fights the fans.</text>
<text class="n" x="640" y="321" text-anchor="start">Run intake slightly stronger —</text>
<text class="n" x="640" y="338" text-anchor="start">positive pressure keeps dust out.</text>
<text class="nh" x="640" y="372" text-anchor="start">PANELS</text>
<text class="n" x="640" y="389" text-anchor="start">Lid and front panel both bolted,</text>
<text class="n" x="640" y="406" text-anchor="start">not welded. You will revise them.</text>
<text class="n" x="640" y="423" text-anchor="start">Filters serviceable from outside</text>
<text class="n" x="640" y="440" text-anchor="start">without opening the cabinet.</text>
<text class="nh" x="640" y="474" text-anchor="start">DO NOT</text>
<text class="n" x="640" y="491" text-anchor="start">Mount HDMI on the front — the</text>
<text class="n" x="640" y="508" text-anchor="start">screen is above; a front exit</text>
<text class="n" x="640" y="525" text-anchor="start">means a visible cable loop.</text>
</svg>