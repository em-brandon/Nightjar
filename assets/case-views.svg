<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 760" width="940" height="760" role="img" aria-label="Plan, side section and rear elevation of the Nightjar cabinet">
<title>Nightjar cabinet - plan, side section, rear elevation</title>
<desc>Three orthographic views. Plan with the lid removed shows two devices side by side, the rear plenum, floor intake fans and lid exhaust positions. Side section shows the bottom-to-top airflow path and the HDMI route. Rear elevation shows the sealed rear face against the wall.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
<path d="M2 2 L9 5 L2 8" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round"/>
</marker>
<marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
<path d="M3 2 L7 5 L3 8" fill="none" stroke="context-stroke" stroke-width="1.3" stroke-linecap="round"/>
</marker>
<pattern id="filt" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
<line x1="0" y1="0" x2="0" y2="6" stroke="#B4741F" stroke-width="1" opacity="0.5"/>
</pattern>
</defs>
<style>
.t { font: 600 14px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; letter-spacing:1.2px; }
.st { font: 400 11px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; opacity:.65; }
.n { font: 400 11.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; }
.nh { font: 600 11.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; }
.dim { font: 500 11px ui-monospace,"SF Mono",Menlo,monospace; fill:#B4741F; }
.lb { font: 500 10.5px ui-sans-serif,-apple-system,"Segoe UI",sans-serif; fill:#0F1420; }
</style>
<rect width="940" height="760" fill="#F7F5EF"/>

<text class="t" x="60" y="40" text-anchor="start">PLAN — LID REMOVED</text>
<text class="st" x="60" y="58" text-anchor="start">looking down · 400 × 250</text>
<rect x="60.0" y="90.0" width="328.0" height="205.0" rx="3" fill="#FFFFFF" stroke="#0F1420" stroke-width="1.6"/>
<rect x="69.8" y="112.1" width="146.8" height="150.1" rx="2" fill="#F2EFE6" stroke="#0F1420" stroke-width="1.3"/>
<text class="lb" x="143.23" y="187.17" text-anchor="middle">M720q</text>
<line x1="86.2" y1="112.1" x2="168.2" y2="112.1" stroke="#B4741F" stroke-width="2.4"/>
<rect x="231.4" y="112.1" width="146.8" height="150.1" rx="2" fill="#F2EFE6" stroke="#0F1420" stroke-width="1.3"/>
<text class="lb" x="304.77" y="187.17" text-anchor="middle">bay 2</text>
<line x1="247.8" y1="112.1" x2="329.8" y2="112.1" stroke="#B4741F" stroke-width="2.4"/>
<rect x="60.0" y="90.0" width="328.0" height="32.8" fill="#B4741F" opacity="0.13"/>
<text class="dim" x="224.0" y="110.4" text-anchor="middle">rear plenum 40</text>
<circle cx="142.0" cy="106.4" r="32.8" fill="none" stroke="#B4741F" stroke-width="1.3" stroke-dasharray="5 4"/>
<circle cx="306.0" cy="106.4" r="32.8" fill="none" stroke="#B4741F" stroke-width="1.3" stroke-dasharray="5 4"/>
<circle cx="142.0" cy="254.0" r="32.8" fill="url(#filt)" stroke="#B4741F" stroke-width="1.3"/>
<circle cx="306.0" cy="254.0" r="32.8" fill="url(#filt)" stroke="#B4741F" stroke-width="1.3"/>
<text class="dim" x="224.0" y="258.0" text-anchor="middle">intake (floor)</text>
<text class="dim" x="224.0" y="110.4" text-anchor="middle">exhaust (lid)</text>
<rect x="72.6" y="95.3" width="24" height="14" rx="2" fill="#FFF" stroke="#0F1420" stroke-width="1.2" stroke-dasharray="4 3"/>
<text class="dim" x="68.6" y="128.3" text-anchor="start">HDMI</text>
<path d="M60.0 317.0 L388.0 317.0" fill="none" stroke="#B4741F" stroke-width="1.2" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text class="dim" x="224.0" y="313.0" text-anchor="middle">400</text>
<path d="M38.0 90.0 L38.0 295.0" fill="none" stroke="#B4741F" stroke-width="1.2" marker-start="url(#dm)" marker-end="url(#dm)"/>
<text class="dim" x="34.0" y="192.5" text-anchor="end">250</text>
<text class="t" x="620" y="40" text-anchor="start">SIDE SECTION</text>
<text class="st" x="620" y="58" text-anchor="start">airflow · 250 deep × 120 high</text>
<rect x="620.0" y="90.0" width="205.0" height="98.4" rx="3" fill="#FFFFFF" stroke="#0F1420" stroke-width="1.6"/>
<rect x="642.1" y="153.6" width="150.1" height="28.3" rx="2" fill="#F2EFE6" stroke="#0F1420" stroke-width="1.3"/>
<text class="lb" x="717.17" y="171.69500000000002" text-anchor="middle">M720q 34.5</text>
<path d="M784.0 222.4 L784.0 182.4" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M784.0 176.4 L654.0 124.0" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<path d="M636.4 112.0 L636.4 60.0" fill="none" stroke="#B4741F" stroke-width="1.6" marker-end="url(#ar)"/>
<text class="dim" x="644.4" y="56" text-anchor="start">exhaust</text>
<text class="dim" x="778.0" y="238.39999999999998" text-anchor="middle">filtered intake</text>
<rect x="604.0" y="50.0" width="12" height="178.4" fill="url(#filt)" stroke="#0F1420" stroke-width="1.2"/>
<text class="st" x="598" y="244.39999999999998" text-anchor="end">wall</text>
<path d="M648.1 159.6 L642.4 159.6 L642.4 108.0" fill="none" stroke="#0F1420" stroke-width="1.3" stroke-dasharray="4 3"/>
<text class="lb" x="654.14" y="147.55" text-anchor="start">HDMI to lid coupler</text>
<text class="t" x="620" y="300" text-anchor="start">REAR ELEVATION</text>
<text class="st" x="620" y="318" text-anchor="start">sealed — faces the wall</text>
<rect x="620.0" y="330.0" width="236.2" height="98.4" rx="3" fill="#EAE6DA" stroke="#0F1420" stroke-width="1.6"/>
<rect x="644.0" y="342.0" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="644.0" y="410.4" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="712.0" y="342.0" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="712.0" y="410.4" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="780.0" y="342.0" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="780.0" y="410.4" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="848.0" y="342.0" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<rect x="848.0" y="410.4" width="10" height="6" rx="2" fill="none" stroke="#B4741F" stroke-width="1.2"/>
<text class="n" x="628" y="452.4" text-anchor="start">slotted mounting ears ×8 — level after anchoring</text>
<text class="n" x="628" y="470.4" text-anchor="start">no vents on this face: it is 40 mm from plaster</text>
<text class="n" x="628" y="488.4" text-anchor="start">cable exit grommet on the underside, not here</text>
<text class="nh" x="60" y="430" text-anchor="start">WHY BOTTOM-TO-TOP</text>
<text class="n" x="60" y="452" text-anchor="start">The devices exhaust rearward into the plenum. Lid fans sit directly</text>
<text class="n" x="60" y="469" text-anchor="start">above it, so hot air leaves by the shortest path and never crosses</text>
<text class="n" x="60" y="486" text-anchor="start">an intake. Convection pushes the same direction as the fans, so the</text>
<text class="n" x="60" y="503" text-anchor="start">cabinet still behaves sanely if a fan fails.</text>
<text class="n" x="60" y="537" text-anchor="start">Intake in the floor rather than the front frees the whole front panel</text>
<text class="n" x="60" y="554" text-anchor="start">for the OLED, touch pad and ports — and puts the filters where you</text>
<text class="n" x="60" y="571" text-anchor="start">can pull them without opening the cabinet.</text>
<text class="n" x="60" y="605" text-anchor="start">Acceptance target unchanged: intake air within 5 °C of room ambient,</text>
<text class="n" x="60" y="622" text-anchor="start">package under 80 °C sustained, NVMe under 65 °C, zero throttle events.</text>
</svg>