<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="Nightjar wall mount layout: front elevation and side thermal section">
  <title>Nightjar wall mount layout</title>
  <desc>Front elevation showing the ThinkCentre M720q, companion module with OLED and capacitive touch pad, and LED diffuser channel all bolted to a shared wall backplate. Side section showing 40 to 50 mm standoff clearance behind the unit for rear exhaust.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1 L8 5 L2 9" fill="none" stroke="context-stroke" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M3 2 L7 5 L3 8" fill="none" stroke="context-stroke" stroke-width="1.4" stroke-linecap="round"/>
    </marker>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#0F1420" stroke-width="1.6" opacity="0.45"/>
    </pattern>
  </defs>

  <style>
    .ttl { font: 600 13px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #0F1420; letter-spacing: 1.4px; }
    .h   { font: 600 14px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #0F1420; }
    .s   { font: 400 11.5px ui-sans-serif, -apple-system, "Segoe UI", sans-serif; fill: #0F1420; opacity: 0.68; }
    .d   { font: 500 11.5px ui-monospace, "SF Mono", Menlo, monospace; fill: #B4741F; }
    .box { fill: #FFFFFF; stroke: #0F1420; stroke-width: 1.4; }
    .arr { stroke: #0F1420; stroke-width: 1.4; fill: none; opacity: 0.75; }
    .amb { stroke: #B4741F; stroke-width: 1.4; fill: none; }
  </style>

  <rect width="1000" height="520" fill="#F7F5EF"/>

  <!-- ============ FRONT ELEVATION ============ -->
  <text class="ttl" x="40" y="34">FRONT ELEVATION</text>

  <!-- shared backplate -->
  <rect x="100" y="66" width="340" height="400" rx="6" fill="none" stroke="#0F1420" stroke-width="1.4" stroke-dasharray="7 5" opacity="0.6"/>
  <text class="s" x="270" y="58" text-anchor="middle">shared wall backplate — 3 mm</text>

  <!-- the Tiny -->
  <rect class="box" x="130" y="96" width="250" height="215" rx="5"/>
  <text class="h" x="255" y="192" text-anchor="middle">ThinkCentre M720q</text>
  <text class="s" x="255" y="212" text-anchor="middle">vertical · exhaust facing up</text>
  <text class="s" x="255" y="230" text-anchor="middle">179 × 183 × 34.5 mm</text>
  <!-- VESA fixing points -->
  <circle cx="160" cy="126" r="3.5" class="amb"/>
  <circle cx="350" cy="126" r="3.5" class="amb"/>
  <circle cx="160" cy="281" r="3.5" class="amb"/>
  <circle cx="350" cy="281" r="3.5" class="amb"/>

  <!-- companion module -->
  <rect class="box" x="130" y="341" width="250" height="94" rx="5"/>
  <text class="s" x="142" y="357">Companion module — Pico, fanless</text>

  <!-- OLED window -->
  <rect x="142" y="366" width="125" height="52" rx="3" fill="#0F1420"/>
  <text x="204" y="396" text-anchor="middle" font="600 11px ui-sans-serif" fill="#F2EFE6"
        style="font: 600 11px ui-sans-serif, sans-serif">2.42&#8243; OLED</text>

  <!-- capacitive pad, behind the panel: dashed = not a through-hole -->
  <circle cx="330" cy="392" r="19" stroke="#B4741F" stroke-width="1.6" fill="none" stroke-dasharray="4 3"/>
  <text class="d" x="330" y="396" text-anchor="middle">TTP223</text>
  <text class="s" x="330" y="428" text-anchor="middle">no hole</text>

  <!-- LED diffuser channel -->
  <rect x="400" y="96" width="15" height="339" rx="4" fill="#E8A33D" opacity="0.35" stroke="#B4741F" stroke-width="1.2"/>
  <text class="s" x="407" y="266" text-anchor="middle" transform="rotate(-90 407 266)">WS2812 in diffuser</text>

  <!-- annotation: OLED bolts to plate not to the Tiny -->
  <path d="M300 470 L300 484 L150 484" class="arr" marker-end="url(#ar)"/>
  <text class="s" x="306" y="474">every part bolts to the backplate — nothing is drilled into the Tiny</text>

  <!-- ============ SIDE SECTION ============ -->
  <text class="ttl" x="580" y="34">SIDE SECTION — AIRFLOW</text>

  <!-- wall -->
  <rect x="584" y="66" width="18" height="340" fill="url(#hatch)" stroke="#0F1420" stroke-width="1.4"/>
  <text class="s" x="593" y="424" text-anchor="middle">wall</text>

  <!-- standoffs -->
  <rect x="602" y="118" width="46" height="13" rx="2" fill="#0F1420" opacity="0.8"/>
  <rect x="602" y="336" width="46" height="13" rx="2" fill="#0F1420" opacity="0.8"/>
  <text class="s" x="625" y="112" text-anchor="middle">standoff</text>

  <!-- backplate edge -->
  <rect x="648" y="76" width="10" height="320" rx="2" class="box"/>

  <!-- the Tiny, on edge -->
  <rect class="box" x="658" y="100" width="58" height="272" rx="4"/>
  <text class="s" x="687" y="240" text-anchor="middle" transform="rotate(-90 687 240)">M720q · 34.5 mm</text>

  <!-- rear vent marks -->
  <line x1="662" y1="130" x2="662" y2="342" stroke="#0F1420" stroke-width="1" stroke-dasharray="3 6" opacity="0.5"/>

  <!-- convection through the gap -->
  <path d="M625 400 L625 150" class="amb" marker-end="url(#ar)"/>

  <!-- exhaust -->
  <path d="M687 100 L687 52" class="amb" marker-end="url(#ar)"/>
  <text class="d" x="700" y="50">exhaust rises</text>

  <!-- clearance dimension -->
  <path d="M602 268 L658 268" stroke="#B4741F" stroke-width="1.3" marker-start="url(#dim)" marker-end="url(#dim)"/>
  <text class="d" x="630" y="260" text-anchor="middle">40–50 mm</text>

  <!-- notes -->
  <text class="s" x="740" y="150">rear vents must stay clear —</text>
  <text class="s" x="740" y="168">flat against the wall traps</text>
  <text class="s" x="740" y="186">the exhaust and cooks it</text>

  <text class="s" x="740" y="300">never mount inverted:</text>
  <text class="s" x="740" y="318">convection works with you</text>
  <text class="s" x="740" y="336">only in one orientation</text>
</svg>
