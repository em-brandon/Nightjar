<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Nightjar">
  <title>Nightjar</title>
  <defs>
    <clipPath id="nj-moon">
      <circle cx="75" cy="27" r="13"/>
    </clipPath>
  </defs>

  <rect width="100" height="100" rx="22" fill="#0F1420"/>

  <!-- crescent moon -->
  <g clip-path="url(#nj-moon)">
    <circle cx="75" cy="27" r="13" fill="#F2EFE6" opacity="0.85"/>
    <circle cx="68" cy="23" r="13" fill="#0F1420"/>
  </g>

  <!-- branch: nightjars perch lengthwise, along the limb -->
  <path d="M12 64 H88" stroke="#F2EFE6" stroke-width="2.5" stroke-linecap="round" opacity="0.35"/>

  <!-- body -->
  <path d="M24 47
           C24 41, 32 37.5, 40 38.6
           C52 40, 60 43, 70 49
           L86 60
           C74 58, 62 58, 52 57
           C40 56, 26 53.5, 24 47 Z"
        fill="#F2EFE6"/>

  <!-- bill -->
  <path d="M24.5 45.5 L17 49 L24.5 51.5 Z" fill="#F2EFE6"/>

  <!-- folded wing -->
  <path d="M40 44.5 C54 46, 65 50, 76 56.6 C64 53, 50 49, 40 44.5 Z"
        fill="#0F1420" opacity="0.16"/>

  <!-- the eye is the alert -->
  <circle cx="33.5" cy="45.5" r="4.2" fill="#E8A33D"/>
  <circle cx="33.5" cy="45.5" r="1.7" fill="#0F1420"/>
</svg>
