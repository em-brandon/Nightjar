<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>nightjar</title>
<style>
  :root{
    --ink:#0F1420; --bone:#F2EFE6; --muted:#5A6577; --amber:#E8A33D; --green:#4FA882;
    --mono: ui-monospace,"SF Mono",Menlo,monospace;
    --sans: "Inter",ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);color:var(--bone);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  .stage{width:100%;max-width:620px;padding:40px}

  .mark{display:flex;align-items:center;gap:16px;margin-bottom:34px}
  .mark svg{width:56px;height:56px;flex:none}
  .mark h1{font-size:30px;font-weight:600;letter-spacing:-.8px}
  .mark h1 span{color:var(--amber)}
  .mark p{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:3px}

  /* boot lines */
  .boot{font-family:var(--mono);font-size:12.5px;line-height:2.05;min-height:210px}
  .ln{opacity:0;display:flex;gap:10px;align-items:baseline}
  .ln .st{width:16px;flex:none;color:var(--muted)}
  .ln.done .st{color:var(--green)}
  .ln .nm{color:var(--bone)}
  .ln .ver{color:var(--muted);margin-left:auto}
  @media (prefers-reduced-motion: no-preference){
    .ln{transition:opacity .28s ease}
  }
  .ln.show{opacity:1}

  .rule{height:1px;background:#232B3C;margin:26px 0 14px}
  .foot{display:flex;font-family:var(--mono);font-size:11px;color:var(--muted)}
  .foot .r{margin-left:auto}
  .cursor{display:inline-block;width:7px;height:13px;background:var(--amber);
          vertical-align:-1px;animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion: reduce){ .cursor{animation:none} }
</style>
</head>
<body>
<div class="stage">

  <div class="mark">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect width="100" height="100" rx="22" fill="#0F1420"/>
      <path d="M12 64 H88" stroke="#F2EFE6" stroke-width="2.5" stroke-linecap="round" opacity=".28"/>
      <path d="M24 47 C24 41,32 37.5,40 38.6 C52 40,60 43,70 49 L86 60
               C74 58,62 58,52 57 C40 56,26 53.5,24 47 Z" fill="#F2EFE6"/>
      <path d="M24.5 45.5 L17 49 L24.5 51.5 Z" fill="#F2EFE6"/>
      <circle cx="33.5" cy="45.5" r="4.2" fill="#E8A33D"/>
      <circle cx="33.5" cy="45.5" r="1.7" fill="#0F1420"/>
    </svg>
    <div>
      <h1>night<span>jar</span></h1>
      <p>incident hub</p>
    </div>
  </div>

  <div class="boot" id="boot"></div>

  <div class="rule"></div>
  <div class="foot">
    <span id="host">wall · tiny-01</span>
    <span class="r" id="stamp"></span>
  </div>

</div>

<script>
  const LINES = [
    ['caddy',      'reverse proxy',   '2.8'],
    ['postgres',   'issue store',     '16.4'],
    ['fastapi',    'hub',             '0.115'],
    ['react',      'console',         '19.1'],
    ['sentry',     'exception capture','—'],
    ['pushover',   'push channel',    'ok'],
    ['pico',       'status + oled',   'ttyACM0'],
  ];

  const boot = document.getElementById('boot');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  LINES.forEach(([name, role, ver], i) => {
    const el = document.createElement('div');
    el.className = 'ln';
    el.innerHTML = `<span class="st">·</span><span class="nm">${name}</span>` +
                   `<span style="color:var(--muted)">${role}</span>` +
                   `<span class="ver">${ver}</span>`;
    boot.appendChild(el);

    const delay = reduce ? 0 : 140 + i * 190;
    setTimeout(() => {
      el.classList.add('show');
      setTimeout(() => {
        el.classList.add('done');
        el.querySelector('.st').textContent = '✓';
      }, reduce ? 0 : 260);
    }, delay);
  });

  // final line, then hand off
  const tail = document.createElement('div');
  tail.className = 'ln';
  tail.innerHTML = '<span class="st"></span><span class="nm">ready<span class="cursor"></span></span>';
  boot.appendChild(tail);
  setTimeout(() => tail.classList.add('show'), reduce ? 0 : 140 + LINES.length * 190);

  const d = new Date();
  document.getElementById('stamp').textContent =
    d.toISOString().slice(0,10) + ' ' +
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

  // In the real kiosk this redirects to /wall once the hub answers /healthz.
  // setTimeout(() => location.href = '/wall', 2400);
</script>
</body>
</html>
