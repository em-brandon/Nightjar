# Nightjar on a VPS: the hub, its database, and Caddy serving the console over TLS.
#
# Note the restart policies: `unless-stopped` everywhere. A watchdog that does
# not come back after a reboot is worse than no watchdog, because its silence
# reads as "all clear".

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Deliberately not published to the host. Only the hub reaches it, over
    # the internal compose network.

  hub:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      VERIFY_SIGNATURES: "true"
      # Required. Without it the hub refuses to start, because the console API
      # (including every write) would be open to the internet.
      CONSOLE_TOKEN: ${CONSOLE_TOKEN:?set CONSOLE_TOKEN in .env (openssl rand -base64 32)}
      SPIKE_THRESHOLD: ${SPIKE_THRESHOLD:-50}
      SPIKE_WINDOW_MIN: ${SPIKE_WINDOW_MIN:-10}
    # Also not published. Caddy is the only way in.

  caddy:
    # Caddy with the compiled console and the Caddyfile baked in (deploy/caddy.Dockerfile). Rebuild it to change either:
    #   docker compose build caddy && docker compose up -d caddy
    build:
      context: .
      dockerfile: deploy/caddy.Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    environment:
      HUB_DOMAIN: ${HUB_DOMAIN}
    depends_on:
      - hub

volumes:
  pgdata:
  caddy_data:
  caddy_config:
